char_starting_location: [ -0.3, -0.2, -0.5 ]
bvh_projection_bodypart_groups:
  - bvh_joint_names:
      - RightArm
      - RightForeArm
      - RightHand
      - LeftArm
      - LeftForeArm
      - LeftHand
    method: pca #frontal #pca #sagittal
    name: Upper Limbs
  - bvh_joint_names:
      - RightUpLeg
      - RightLeg
      - RightFoot
      - LeftUpLeg
      - LeftLeg
      - LeftFoot
    method: pca #frontal #pca
    name: Lower Limbs
  - bvh_joint_names:
      - Hips
      - Spine
      - Spine3
      - Neck
    method: frontal #pca #frontal
    name: Trunk
char_bodypart_groups:
  - bvh_depth_drivers:
      - Hips
    char_joints:
      - right_hip_b
      - left_hip_b
      - right_hip_f
      - left_hip_f
      - hip
  - bvh_depth_drivers:
      - Neck
    char_joints:
      - neck
      - torso
  - bvh_depth_drivers:
      - LeftFoot
    char_joints:
      - left_knee_f
      - left_foot_f
  - bvh_depth_drivers:
      - LeftFoot
    char_joints:
      - left_knee_b
      - left_foot_b
  - bvh_depth_drivers:
      - RightFoot
    char_joints:
      - right_knee_f
      - right_foot_f
  - bvh_depth_drivers:
      - RightFoot
    char_joints:
      - right_knee_b
      - right_foot_b
char_bvh_root_offset:
  bvh_projection_bodypart_group_for_offset: Lower Limbs
  bvh_joints:
    - - RightFoot
      - RightLeg
      - RightUpLeg
    - - LeftFoot
      - LeftLeg
      - LeftUpLeg
  char_joints:
    - - left_foot_f
      - left_knee_f
      - left_hip_f
    - - right_foot_f
      - right_knee_f
      - right_hip_f
    - - left_foot_b
      - left_knee_b
      - left_hip_b
    - - right_foot_b
      - right_knee_b
      - right_hip_b
char_joint_bvh_joints_mapping:
#  torso: !!python/tuple
#    - Spine
#    - Spine3
#  neck: !!python/tuple
#    - Hips
#    - Spine
  left_foot_b: !!python/tuple
    - LeftLeg
    - LeftFoot
  left_knee_b: !!python/tuple
    - LeftUpLeg
    - LeftLeg
  right_foot_b: !!python/tuple
    - RightLeg
    - RightFoot
  right_knee_b: !!python/tuple
    - RightUpLeg
    - RightLeg
  left_foot_f: !!python/tuple
    - LeftForeArm
    - LeftHand
  left_knee_f: !!python/tuple
    - LeftArm
    - LeftForeArm
  right_foot_f: !!python/tuple
    - RightForeArm
    - RightHand
  right_knee_f: !!python/tuple
    - RightArm
    - RightForeArm
char_runtime_checks: [ ]